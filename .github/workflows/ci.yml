name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      # Shipped binaries are release builds, where update::endpoint_base must
      # ignore the AISH_UPDATE_* overrides. The debug runs above only ever see
      # cfg!(debug_assertions) as true, so only this run checks that wiring.
      - run: cargo test --release --lib update::
